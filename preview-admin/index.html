<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>あ箱 Preview 発行</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;background:#111;color:#eee}.wrap{max-width:680px;margin:auto;padding:32px 18px 60px}h1{font-size:24px;margin:0 0 6px}.lead{opacity:.7;margin:0 0 28px}.card{background:#1c1c1c;border:1px solid #333;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-size:13px;opacity:.75;margin-bottom:7px}input,select,button{font:inherit}input[type=password],select{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:#fff}.drop{display:block;border:1px dashed #666;border-radius:14px;padding:28px 14px;text-align:center;cursor:pointer}.drop input{display:none}.name{margin-top:10px;font-size:13px;opacity:.75;word-break:break-all}.row{display:grid;grid-template-columns:1fr 120px;gap:10px;margin-top:14px}.primary{width:100%;padding:14px;border:0;border-radius:12px;background:#fff;color:#111;font-weight:700;cursor:pointer}.primary:disabled{opacity:.4}.result{display:none}.url{padding:12px;border-radius:10px;background:#0d0d0d;word-break:break-all;font-size:13px}.actions{display:flex;gap:8px;margin-top:10px}.actions button,.actions a{flex:1;text-align:center;padding:11px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;text-decoration:none;cursor:pointer}.status{min-height:1.4em;font-size:13px;opacity:.75;margin-top:10px}.note{font-size:12px;opacity:.55;line-height:1.7}
</style></head><body><main class="wrap"><h1>あ箱 Preview</h1><p class="lead">作者確認用の限定リンクを発行します。正式公開・販売・本棚には登録されません。</p><section class="card"><label>管理キー</label><input id="key" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN"><div class="row"><label class="drop">.scene を選ぶ<input id="file" type="file" accept=".scene,application/octet-stream"><div id="fileName" class="name">Master.scene / 配付用.scene</div></label><div><label>有効期限</label><select id="days"><option value="1">1日</option><option value="3">3日</option><option value="7" selected>7日</option><option value="14">14日</option><option value="30">30日</option></select></div></div><button id="issue" class="primary" type="button" disabled>確認URLを発行</button><div id="status" class="status"></div></section><section id="result" class="card result"><label>作者へ渡すURL</label><div id="url" class="url"></div><div class="actions"><button id="copy" type="button">URLをコピー</button><a id="open" target="_blank" rel="noopener">開いて確認</a></div></section><p class="note">URLを知っている人だけが閲覧できます。期限後は自動的に開けなくなります。検索エンジンには登録させません。</p></main><script>
(()=>{'use strict';const API='https://scene-studio-api.a-hako.workers.dev';const key=document.getElementById('key'),file=document.getElementById('file'),fileName=document.getElementById('fileName'),days=document.getElementById('days'),issue=document.getElementById('issue'),status=document.getElementById('status'),result=document.getElementById('result'),urlNode=document.getElementById('url'),copy=document.getElementById('copy'),open=document.getElementById('open');try{key.value=sessionStorage.getItem('ahako:preview-admin-key')||'';}catch(_){}function ready(){issue.disabled=!(key.value.trim()&&file.files?.[0]);}key.addEventListener('input',ready);file.addEventListener('change',()=>{fileName.textContent=file.files?.[0]?.name||'Master.scene / 配付用.scene';ready();});issue.addEventListener('click',async()=>{const f=file.files?.[0],secret=key.value.trim();if(!f||!secret)return;issue.disabled=true;status.textContent='アップロード中…';result.style.display='none';try{try{sessionStorage.setItem('ahako:preview-admin-key',secret);}catch(_){}const r=await fetch(`${API}/admin/previews?days=${encodeURIComponent(days.value)}`,{method:'POST',headers:{'X-Admin-Key':secret,'X-File-Name':f.name,'Content-Type':f.type||'application/octet-stream'},body:f});const data=await r.json().catch(()=>({}));if(!r.ok||!data?.ok)throw new Error(data?.error||`HTTP ${r.status}`);const u=String(data.preview?.url||'');urlNode.textContent=u;open.href=u;result.style.display='block';status.textContent=`発行しました（${days.value}日間）`;copy.onclick=async()=>{try{await navigator.clipboard.writeText(u);copy.textContent='コピーしました';setTimeout(()=>copy.textContent='URLをコピー',1200);}catch(_){}};}catch(e){status.textContent=String(e?.message||e);}finally{ready();}});ready();})();
</script></body></html>
