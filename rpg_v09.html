*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090d;color:#fff;font-family:system-ui,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}button{font:inherit;color:inherit;cursor:pointer}#app{position:relative;max-width:480px;margin:auto;min-height:100dvh;overflow:hidden;background:#08090d}.logo{position:absolute;top:38px;left:22px;font:10px monospace;letter-spacing:3px;color:#9fa8bd}.stage{position:relative;margin:135px 18px 0;height:480px;touch-action:pan-y}.window{position:absolute;background:#18181b;border:2px solid #f5f5f5;border-radius:7px;box-shadow:0 0 0 3px #777,0 0 0 6px #111,0 8px 16px #0009;padding:16px 13px;will-change:transform,opacity;transition:transform 190ms cubic-bezier(.2,.8,.2,1),opacity 190ms ease,filter 190ms ease;user-select:none;-webkit-user-select:none}.window.inactive{filter:brightness(.42);pointer-events:none}.window.active{filter:brightness(1)}.window.dragging{transition:none!important;cursor:grabbing}.window.active{touch-action:pan-y}.window.exit{transition:transform 190ms cubic-bezier(.15,.8,.35,1),opacity 180ms linear!important;transform:translate3d(125vw,0,0)!important;opacity:0!important;pointer-events:none}.window.enter{animation:appear 170ms cubic-bezier(.2,.8,.2,1) both}@keyframes appear{from{opacity:0;transform:translate3d(24px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}.w0{top:10px;left:12px;width:188px;min-height:205px;z-index:1}.w1{top:76px;left:37px;width:calc(100% - 55px);min-height:215px;z-index:2}.w2{top:135px;left:5px;width:calc(100% - 10px);min-height:330px;z-index:3}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:43px;padding:8px 7px 8px 20px;background:transparent;border:0;text-align:left;position:relative;font-weight:650;font-size:15px;border-radius:2px}.row:active{background:#ffffff18}.row.sel:before{content:'▶';position:absolute;left:1px;font-size:12px}.row small{font:12px monospace;white-space:nowrap;color:#e6e6e6}.detailHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #888;padding:0 1px 12px;font-size:15px;font-weight:700}.detailHead small{font-size:12px;font-weight:400}.tabs{display:flex;gap:4px;border-bottom:1px solid #777;padding:9px 0}.tabs button{flex:1;background:none;border:0;padding:9px 0;font-size:13px;white-space:nowrap}.tabs button.sel:before{content:'▶';font-size:9px;margin-right:3px}.stats{padding:11px 2px 0}.stat{display:flex;justify-content:space-between;padding:5px 1px;font-size:14px}.stat span:last-child{font-variant-numeric:tabular-nums}.actions{position:absolute;right:23px;bottom:calc(48px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}.back{width:47px;height:47px;border:2px solid #eee;border-radius:10px;background:#242429;font-size:22px;font-weight:800;box-shadow:0 0 0 3px #444}.back:active{transform:scale(.94)}.back[hidden]{display:none}.mode{position:absolute;top:28px;right:20px;border:1px solid #777;background:#17171c;border-radius:4px;padding:9px 12px;font-size:11px}.hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:23px;font:10px monospace;letter-spacing:1px;color:#697184}.detailBody{min-height:205px}.empty{color:#aaa;font-size:13px;padding:14px 4px}.window:not(.active){touch-action:pan-y}@media(max-width:360px){.w1{left:26px;width:calc(100% - 40px)}.row{font-size:14px}.w2{left:2px;width:calc(100% - 4px)}}@media(prefers-reduced-motion:reduce){.window,.window.exit{transition-duration:0ms!important}.window.enter{animation:none}}

.logo{top:34px}.mode{top:23px;right:18px}.entry{position:absolute;top:72px;right:18px;background:#17171c;border:1px solid #555;color:#eee;padding:7px;border-radius:4px;font-size:11px;max-width:145px}.stage{margin-top:138px;height:520px}.window{touch-action:pan-y}.w0{top:10px}.w1{top:74px}.w2{top:135px}.window.solo-list{top:10px;left:12px;width:calc(100% - 42px)}.window.solo-detail{top:10px;left:6px;width:calc(100% - 12px)}.window.detail-after-list{top:82px}.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;color:#ddd}.scene.show{display:flex}.scene h1{font-size:24px;letter-spacing:.14em;font-weight:500}.scene p{font-size:13px;color:#8c94a5}.scene button{border:2px solid #eee;background:#18181b;padding:12px 22px;border-radius:6px}.hint{display:none}.mode:focus-visible,.entry:focus-visible,.row:focus-visible,.tabs button:focus-visible{outline:2px solid #fff;outline-offset:3px}</style></head><body><main id="app"><div class="logo">RPG COMMAND / 09</div><button class="mode" id="mode">きょうのおれ</button><select class="entry" id="entry" aria-label="入口の種類"><option value="command">入口：コマンド</option><option value="list">入口：なかま</option><option value="detail">入口：詳細</option></select><div class="stage" id="stage"></div><div class="scene" id="scene"><h1>SCENE 02</h1><p>枠外タップで次へ進んだ状態のデモ</p><button>コマンドにもどる</button></div></main><script>const groups={rpg:[{name:'ロク',lv:12,job:'旅人',stats:[['HP','86 / 86'],['MP','45 / 45'],['ちから',32],['すばやさ',24],['みのまもり',22],['かしこさ',18],['こうげき力',34],['しゅび力',27],['けいけんち',1260]],gear:[['ぶき','ひのきのぼう'],['よろい','たびびとのふく'],['たて','なし'],['かざり','ふるいメガネ']],history:[['旅人','Lv 12'],['魔法使い','Lv 3']]},{name:'ナナ',lv:14,job:'盗賊',stats:[['HP','73 / 73'],['MP','28 / 28'],['ちから',27],['すばやさ',49],['みのまもり',19],['かしこさ',25]],gear:[['ぶき','かぜきりの短剣'],['よろい','かわのふく']],history:[['盗賊','Lv 14']]},{name:'セラ',lv:13,job:'僧侶',stats:[['HP','64 / 64'],['MP','91 / 91'],['ちから',15],['すばやさ',29],['みのまもり',17],['かしこさ',52]],gear:[['ぶき','かしのつえ'],['よろい','ぬののふく']],history:[['僧侶','Lv 13']]},{name:'ガルド',lv:15,job:'戦士',stats:[['HP','132 / 132'],['MP','8 / 8'],['ちから',61],['すばやさ',12],['みのまもり',48],['かしこさ',9]],gear:[['ぶき','てつのつるぎ'],['よろい','くさりかたびら']],history:[['戦士','Lv 15']]}],daily:[{name:'きょうのおれ',lv:'—',job:'開発者',stats:[['たいりょく','12 / 100'],['やるき','3 / 100'],['ねむけ',98],['さいふ','1,280 G'],['バグ',17],['ひらめき',99]],gear:[['ぶき','ノートPC'],['よろい','部屋着'],['かざり','メガネ']],history:[['開発者','現在'],['作家','兼業'],['冒険者','志望']]}]};
let mode='rpg',entry='command',depth=0,person=0,tab=0,locked=false,sceneIndex=0;
const stage=document.getElementById('stage'),modeBtn=document.getElementById('mode'),entrySelect=document.getElementById('entry'),scene=document.getElementById('scene');const categories=['つよさ','そうび','しょくれき'];
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function row(label,right,cb,selected=false){let b=el('button','row'+(selected?' sel':''));b.innerHTML='<span></span><small></small>';b.children[0].textContent=label;b.children[1].textContent=right||'';b.onclick=cb;return b}
function levels(){return entry==='command'?['command','list','detail']:entry==='list'?['list','detail']:['detail']}
function win(type,idx){const cls=type==='command'?'w0':type==='list'?'w1':'w2';let extra=entry==='list'&&type==='list'?' solo-list':entry==='detail'?' solo-detail':entry==='list'&&type==='detail'?' detail-after-list':'';
 let w=el('section',`window ${cls}${extra} ${idx===depth?'active enter':'inactive'}`);w.dataset.level=idx;
 if(type==='command'){['なかま','アイテム','きろく'].forEach((c,i)=>w.append(row(c,'',()=>{if(i===0){depth=1;render()}else{entryMessage=c}},i===0)))}
 if(type==='list'){groups[mode].forEach((p,i)=>w.append(row(p.name,mode==='rpg'?'Lv '+p.lv:p.job,()=>{person=i;tab=0;depth=idx+1;render()},i===person)))}
 if(type==='detail'){let p=groups[mode][person],head=el('div','detailHead');head.innerHTML='<span></span><small></small>';head.children[0].textContent=p.name+(mode==='rpg'?'  Lv '+p.lv:'');head.children[1].textContent=p.job;w.append(head);let tabs=el('div','tabs');categories.forEach((c,i)=>{let b=el('button',i===tab?'sel':'',c);b.onclick=()=>{tab=i;render()};tabs.append(b)});w.append(tabs);let body=el('div','detailBody'),data=tab===0?p.stats:tab===1?p.gear:p.history,list=el('div','stats');data.forEach(([a,b])=>{let r=el('div','stat');r.append(el('span','',a),el('span','',String(b)));list.append(r)});body.append(list);w.append(body)}return w}
let entryMessage='';function render(){stage.replaceChildren();const arr=levels();for(let i=0;i<=depth;i++)stage.append(win(arr[i],i));scene.classList.remove('show');stage.style.display='block';modeBtn.textContent=mode==='rpg'?'きょうのおれ':'RPGに切替';if(depth>0)bindSwipe(stage.lastElementChild);}
function nextScene(){sceneIndex++;stage.style.display='none';scene.classList.add('show');scene.querySelector('h1').textContent=`SCENE ${String(sceneIndex+1).padStart(2,'0')}`;}
function goBack(animated=false,fromX=0,velocity=0){if(depth===0||locked)return;const current=stage.lastElementChild;if(!animated||matchMedia('(prefers-reduced-motion: reduce)').matches){depth--;render();return}locked=true;const previous=current.previousElementSibling;if(previous){previous.classList.remove('inactive');previous.style.filter='brightness(1)'}current.classList.remove('enter','dragging');current.style.transition='none';current.style.transform=`translate3d(${fromX}px,0,0)`;current.style.opacity='1';void current.offsetWidth;const distance=innerWidth+current.offsetWidth;const duration=Math.max(125,Math.min(245,(distance-fromX)/Math.max(2.8,velocity*2.3)));current.style.transition=`transform ${duration}ms cubic-bezier(.18,.72,.28,1),opacity ${duration}ms ease-in`;requestAnimationFrame(()=>{current.style.transform=`translate3d(${distance}px,0,0)`;current.style.opacity='.75'});setTimeout(()=>{depth--;locked=false;render()},duration+28)}
function bindSwipe(w){let active=false,swiping=false,startX=0,startY=0,lastX=0,lastTime=0,velocity=0,offset=0,suppressClick=false;const behind=w.previousElementSibling;w.style.touchAction='pan-y';function begin(x,y){if(locked)return;active=true;swiping=false;startX=lastX=x;startY=y;lastTime=performance.now();velocity=0;offset=0;suppressClick=false;w.classList.remove('enter')}
function move(x,y,event){if(!active)return;const dx=x-startX,dy=y-startY;if(!swiping){if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>9){active=false;return}if(dx>5&&dx>Math.abs(dy)*1.05){swiping=true;w.classList.add('dragging')}}if(!swiping)return;if(event&&event.cancelable)event.preventDefault();offset=Math.max(0,dx);const now=performance.now(),dt=now-lastTime;if(dt>0){const instant=(x-lastX)/dt;velocity=velocity*.35+instant*.65}lastX=x;lastTime=now;w.style.transform=`translate3d(${offset}px,0,0)`;w.style.opacity=String(Math.max(.85,1-offset/1800));if(behind)behind.style.filter=`brightness(${Math.min(1,.42+offset/190)})`}
function finish(cancelled=false){if(!active&&!swiping)return;active=false;if(!swiping)return;swiping=false;w.classList.remove('dragging');suppressClick=true;setTimeout(()=>suppressClick=false,350);if(!cancelled&&(offset>Math.min(90,w.offsetWidth*.24)||(offset>18&&velocity>.45))){goBack(true,offset,Math.max(velocity,0));return}w.style.transition='transform 220ms cubic-bezier(.2,.85,.25,1),opacity 220ms ease';w.style.transform='translate3d(0,0,0)';w.style.opacity='1';if(behind)behind.style.filter='brightness(.42)';setTimeout(()=>{if(w.isConnected)w.style.transition=''},240)}
w.addEventListener('touchstart',e=>{if(e.touches.length===1)begin(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});w.addEventListener('touchmove',e=>{if(e.touches.length===1)move(e.touches[0].clientX,e.touches[0].clientY,e)},{passive:false});w.addEventListener('touchend',()=>finish(),{passive:true});w.addEventListener('touchcancel',()=>finish(true),{passive:true});w.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;begin(e.clientX,e.clientY);w.setPointerCapture(e.pointerId)});w.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')move(e.clientX,e.clientY,e)});w.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')finish()});w.addEventListener('pointercancel',e=>{if(e.pointerType==='mouse')finish(true)});w.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopPropagation()}},true)}
// Outside tap advances only when the smallest card is visible.
document.getElementById('app').addEventListener('click',e=>{if(scene.classList.contains('show')||locked||depth!==0)return;if(e.target.closest('.window,.mode,.entry'))return;nextScene()});
scene.querySelector('button').onclick=()=>{depth=0;render()};modeBtn.onclick=()=>{mode=mode==='rpg'?'daily':'rpg';depth=0;person=0;tab=0;render()};entrySelect.onchange=()=>{entry=entrySelect.value;depth=0;person=0;tab=0;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();goBack(true)}if(e.key==='ArrowRight'&&depth>0)goBack(true);if(e.key==='Enter'&&depth<levels().length-1){e.preventDefault();depth++;render()}});render();</script></body></html>
