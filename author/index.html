<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171a20">
  <title>作者の本棚｜あ箱</title>
  <meta name="description" content="あ箱で公開されている作者の本棚です。">
  <link rel="stylesheet" href="author-shelf.css?v=68.4">
</head>
<body>
  <header class="visitor-header">
    <div class="ahako-mark"><strong><span>あ</span><span class="box">□</span></strong><small>PUBLIC BOOKSHELF</small></div>
    <div class="visitor-badge"><span aria-hidden="true"></span>公開本棚を訪問中</div>
    <a class="my-shelf-link" href="../bookshelf/">自分の本棚へ</a>
  </header>

  <main>
    <section id="loadingState" class="state-panel" aria-live="polite">
      <span class="state-mark">□</span>
      <strong>本棚を開いています…</strong>
    </section>

    <section id="errorState" class="state-panel" hidden>
      <span class="state-mark">!</span>
      <h1>本棚を開けませんでした</h1>
      <p id="errorMessage">URLを確認して、もう一度お試しください。</p>
      <button id="retryButton" type="button">もう一度試す</button>
    </section>

    <div id="shelfContent" hidden>
      <section class="author-hero">
        <div id="authorHeroImage" class="author-hero-image" aria-hidden="true"></div>
        <div class="author-hero-copy">
          <p class="eyebrow">AUTHOR'S PUBLIC BOOKSHELF</p>
          <h1 id="authorName"></h1>
          <p id="authorShelfLead">この作者が、あ箱で公開している本です。</p>
        </div>
        <div class="author-hero-side">
          <dl class="shelf-counts">
            <div><dt>BOOKS</dt><dd id="workCount">0</dd></div>
            <div><dt>BOXES</dt><dd id="seriesCount">0</dd></div>
          </dl>
          <button id="shareShelfButton" class="share-button" type="button">本棚を共有</button>
        </div>
      </section>

      <section id="seriesSection" class="shelf-section" hidden>
        <header class="section-heading">
          <div><p class="eyebrow">SERIES BOX</p><h2>シリーズから読む</h2></div>
          <p>BOXを開いて、読む順番を選べます。</p>
        </header>
        <div id="seriesBoxes" class="series-rail" aria-label="シリーズBOX"></div>
      </section>

      <section id="unboxedSection" class="shelf-section" hidden>
        <header class="section-heading">
          <div><p class="eyebrow">BOOKS</p><h2>公開中の本</h2></div>
          <p id="unboxedCount"></p>
        </header>
        <div id="unboxedBooks" class="book-grid"></div>
      </section>

      <section id="emptyShelf" class="empty-shelf" hidden>
        <span>□</span><h2>公開中の本はまだありません</h2><p>作者が本を公開すると、ここに並びます。</p>
      </section>
    </div>
  </main>

  <dialog id="seriesDialog" class="reader-dialog">
    <div class="reader-dialog-card series-dialog-card">
      <button class="dialog-close" type="button" data-close="seriesDialog" aria-label="閉じる">×</button>
      <p class="eyebrow">SERIES BOX</p>
      <h2 id="seriesDialogTitle"></h2>
      <p id="seriesDialogMeta" class="dialog-lead"></p>
      <div id="seriesDialogBooks" class="series-dialog-books"></div>
    </div>
  </dialog>

  <dialog id="workDialog" class="reader-dialog">
    <div class="reader-dialog-card work-dialog-card">
      <button class="dialog-close" type="button" data-close="workDialog" aria-label="閉じる">×</button>
      <div id="workDialogContent"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden aria-live="polite"></div>
  <script src="author-shelf.js?v=68.7"></script>
</body>
</html>
