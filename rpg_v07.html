<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RPG COMMAND / 07</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090d;color:#fff;font-family:system-ui,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}button{font:inherit;color:inherit;cursor:pointer}#app{position:relative;max-width:480px;margin:auto;min-height:100dvh;overflow:hidden;background:#08090d}.logo{position:absolute;top:38px;left:22px;font:10px monospace;letter-spacing:3px;color:#9fa8bd}.stage{position:relative;margin:135px 18px 0;height:480px;touch-action:pan-y}.window{position:absolute;background:#18181b;border:2px solid #f5f5f5;border-radius:7px;box-shadow:0 0 0 3px #777,0 0 0 6px #111,0 8px 16px #0009;padding:16px 13px;will-change:transform,opacity;transition:transform 190ms cubic-bezier(.2,.8,.2,1),opacity 190ms ease,filter 190ms ease;user-select:none;-webkit-user-select:none}.window.inactive{filter:brightness(.42);pointer-events:none}.window.active{filter:brightness(1)}.window.dragging{transition:none!important}.window.exit{transition:transform 190ms cubic-bezier(.15,.8,.35,1),opacity 180ms linear!important;transform:translate3d(125vw,0,0)!important;opacity:0!important;pointer-events:none}.window.enter{animation:appear 170ms cubic-bezier(.2,.8,.2,1) both}@keyframes appear{from{opacity:0;transform:translate3d(24px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}.w0{top:10px;left:12px;width:188px;min-height:205px;z-index:1}.w1{top:76px;left:37px;width:calc(100% - 55px);min-height:215px;z-index:2}.w2{top:135px;left:5px;width:calc(100% - 10px);min-height:330px;z-index:3}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:43px;padding:8px 7px 8px 20px;background:transparent;border:0;text-align:left;position:relative;font-weight:650;font-size:15px;border-radius:2px}.row:active{background:#ffffff18}.row.sel:before{content:'▶';position:absolute;left:1px;font-size:12px}.row small{font:12px monospace;white-space:nowrap;color:#e6e6e6}.detailHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #888;padding:0 1px 12px;font-size:15px;font-weight:700}.detailHead small{font-size:12px;font-weight:400}.tabs{display:flex;gap:4px;border-bottom:1px solid #777;padding:9px 0}.tabs button{flex:1;background:none;border:0;padding:9px 0;font-size:13px;white-space:nowrap}.tabs button.sel:before{content:'▶';font-size:9px;margin-right:3px}.stats{padding:11px 2px 0}.stat{display:flex;justify-content:space-between;padding:5px 1px;font-size:14px}.stat span:last-child{font-variant-numeric:tabular-nums}.actions{position:absolute;right:23px;bottom:calc(48px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}.back{width:47px;height:47px;border:2px solid #eee;border-radius:10px;background:#242429;font-size:22px;font-weight:800;box-shadow:0 0 0 3px #444}.back:active{transform:scale(.94)}.back[hidden]{display:none}.mode{position:absolute;top:28px;right:20px;border:1px solid #777;background:#17171c;border-radius:4px;padding:9px 12px;font-size:11px}.hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:23px;font:10px monospace;letter-spacing:1px;color:#697184}.detailBody{min-height:205px}.empty{color:#aaa;font-size:13px;padding:14px 4px}.window:not(.active){touch-action:pan-y}@media(max-width:360px){.w1{left:26px;width:calc(100% - 40px)}.row{font-size:14px}.w2{left:2px;width:calc(100% - 4px)}}@media(prefers-reduced-motion:reduce){.window,.window.exit{transition-duration:0ms!important}.window.enter{animation:none}}
</style></head><body><main id="app"><div class="logo">RPG COMMAND / 07</div><button class="mode" id="mode">きょうのおれ</button><div class="stage" id="stage"></div><div class="actions"><button class="back" id="back" aria-label="もどる" hidden>🅱</button></div><div class="hint">TAP / SWIPE → / ESC</div></main><script>
const groups={rpg:[{name:'ロク',lv:12,job:'旅人',stats:[['HP','86 / 86'],['MP','45 / 45'],['ちから',32],['すばやさ',24],['みのまもり',22],['かしこさ',18],['こうげき力',34],['しゅび力',27],['けいけんち',1260]],gear:[['ぶき','ひのきのぼう'],['よろい','たびびとのふく'],['たて','なし'],['かざり','ふるいメガネ']],history:[['旅人','Lv 12'],['魔法使い','Lv 3']]},{name:'ナナ',lv:14,job:'盗賊',stats:[['HP','73 / 73'],['MP','28 / 28'],['ちから',27],['すばやさ',49],['みのまもり',19],['かしこさ',25]],gear:[['ぶき','かぜきりの短剣'],['よろい','かわのふく']],history:[['盗賊','Lv 14']]},{name:'セラ',lv:13,job:'僧侶',stats:[['HP','64 / 64'],['MP','91 / 91'],['ちから',15],['すばやさ',29],['みのまもり',17],['かしこさ',52]],gear:[['ぶき','かしのつえ'],['よろい','ぬののふく']],history:[['僧侶','Lv 13']]},{name:'ガルド',lv:15,job:'戦士',stats:[['HP','132 / 132'],['MP','8 / 8'],['ちから',61],['すばやさ',12],['みのまもり',48],['かしこさ',9]],gear:[['ぶき','てつのつるぎ'],['よろい','くさりかたびら']],history:[['戦士','Lv 15']]}],daily:[{name:'きょうのおれ',lv:'—',job:'開発者',stats:[['たいりょく','12 / 100'],['やるき','3 / 100'],['ねむけ',98],['さいふ','1,280 G'],['バグ',17],['ひらめき',99]],gear:[['ぶき','ノートPC'],['よろい','部屋着'],['かざり','メガネ']],history:[['開発者','現在'],['作家','兼業'],['冒険者','志望']]}]};
let mode='rpg',depth=0,category=0,person=0,tab=0,drag=null,locked=false;const stage=document.getElementById('stage'),back=document.getElementById('back'),modeBtn=document.getElementById('mode');const categories=['つよさ','そうび','しょくれき'];function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function row(label,right,cb,selected=false){let b=el('button','row'+(selected?' sel':''));b.innerHTML='<span></span><small></small>';b.children[0].textContent=label;b.children[1].textContent=right||'';b.onclick=cb;return b}function win(level){let w=el('section',`window w${level} ${level===depth?'active enter':'inactive'}`);w.dataset.level=level;if(level===0){categories.concat('とじる').forEach((c,i)=>w.append(row(c,'',()=>{if(i===3){depth=0;render();return}category=i;person=0;depth=1;render()},i===category)))}if(level===1){groups[mode].forEach((p,i)=>w.append(row(p.name,mode==='rpg'?'Lv '+p.lv:p.job,()=>{person=i;tab=category;depth=2;render()},i===person)))}if(level===2){let p=groups[mode][person];let head=el('div','detailHead');head.innerHTML='<span></span><small></small>';head.children[0].textContent=p.name+(mode==='rpg'?'  Lv '+p.lv:'');head.children[1].textContent=p.job;w.append(head);let tabs=el('div','tabs');categories.forEach((c,i)=>{let b=el('button',i===tab?'sel':'',c);b.onclick=()=>{tab=i;render()};tabs.append(b)});w.append(tabs);let body=el('div','detailBody'),data=tab===0?p.stats:tab===1?p.gear:p.history;let list=el('div','stats');data.forEach(([a,b])=>{let r=el('div','stat');r.append(el('span','',a),el('span','',String(b)));list.append(r)});body.append(list);w.append(body)}return w}
function render(){stage.replaceChildren();for(let i=0;i<=depth;i++)stage.append(win(i));back.hidden=depth===0;modeBtn.textContent=mode==='rpg'?'きょうのおれ':'RPGに切替';if(depth>0)bindSwipe(stage.querySelector('.w'+depth))}function goBack(animated=false){if(depth===0||locked)return;const current=stage.querySelector('.w'+depth);if(!animated||matchMedia('(prefers-reduced-motion: reduce)').matches){depth--;render();return}locked=true;current.classList.remove('dragging');current.style.transform='';current.style.opacity='';current.classList.add('exit');const previous=stage.querySelector('.w'+(depth-1));if(previous)previous.classList.remove('inactive');setTimeout(()=>{depth--;locked=false;render()},195)}
function bindSwipe(w){let startX=0,startY=0,lastX=0,lastT=0,vx=0,tracking=false,swiping=false;w.addEventListener('pointerdown',e=>{if(locked||e.pointerType==='mouse'&&e.button!==0)return;tracking=true;swiping=false;startX=lastX=e.clientX;startY=e.clientY;lastT=performance.now();vx=0});w.addEventListener('pointermove',e=>{if(!tracking)return;let dx=e.clientX-startX,dy=e.clientY-startY;if(!swiping){if(Math.abs(dy)>Math.abs(dx)+7&&Math.abs(dy)>12){tracking=false;return}if(dx>10&&Math.abs(dx)>Math.abs(dy)*1.15){swiping=true;w.setPointerCapture(e.pointerId);w.classList.add('dragging')}}if(!swiping)return;let x=Math.max(0,dx);let t=performance.now();if(t>lastT)vx=(e.clientX-lastX)/(t-lastT);lastX=e.clientX;lastT=t;w.style.transform=`translate3d(${x}px,0,0)`;w.style.opacity=String(Math.max(.6,1-x/700));const behind=stage.querySelector('.w'+(depth-1));if(behind)behind.style.filter=`brightness(${Math.min(1,.42+x/260)})`});function end(e){if(!tracking)return;tracking=false;if(!swiping)return;swiping=false;let dx=Math.max(0,e.clientX-startX);if(w.hasPointerCapture(e.pointerId))w.releasePointerCapture(e.pointerId);w.classList.remove('dragging');const behind=stage.querySelector('.w'+(depth-1));if(behind)behind.style.filter='';if(dx>Math.min(110,w.offsetWidth*.30)||(dx>28&&vx>.45)){w.style.transform=`translate3d(${dx}px,0,0)`;requestAnimationFrame(()=>goBack(true))}else{w.style.transform='';w.style.opacity=''}}w.addEventListener('pointerup',end);w.addEventListener('pointercancel',()=>{tracking=false;swiping=false;w.classList.remove('dragging');w.style.transform='';w.style.opacity='';let b=stage.querySelector('.w'+(depth-1));if(b)b.style.filter=''})}
back.onclick=()=>goBack(true);modeBtn.onclick=()=>{mode=mode==='rpg'?'daily':'rpg';depth=0;person=0;category=0;tab=0;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();goBack(true)}if(e.key==='ArrowRight'&&depth>0)goBack(true);if(e.key==='Enter'&&depth<2){e.preventDefault();if(depth===0){depth=1}else{tab=category;depth=2}render()}});render();
</script></body></html>
