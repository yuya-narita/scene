<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100b08">
<title>あ箱書店 β</title>
<link rel="stylesheet" href="./bookstore.css?v=2.16.15">

<style id="v211-bg">
/* V2.11 visual trial: supplied grand-library image is a single lightweight background layer. */
.store{background-image:linear-gradient(rgba(8,5,3,.16),rgba(8,5,3,.30)),url('./bookstore-v211-bg.png')!important;background-size:cover!important;background-position:center center!important;background-repeat:no-repeat!important;}
.store>.ambient,.store>.shelf{opacity:0!important;pointer-events:none!important;}

/* V2.11.2: glow experiment removed for motion/visibility isolation. */
.book-face{background:linear-gradient(145deg,#24180f,#0e0a07);}
.book-face .cover-loading{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(20px,5vw,42px);color:rgba(255,236,198,.82);background:radial-gradient(circle at 50% 42%,rgba(170,105,42,.28),rgba(12,8,5,.94) 72%);}
/* Keep the image opaque whenever it exists; rebuilding the ring must not fade a cached cover in again. */
.book-face img{opacity:1;}
.book-face.is-cover-loaded .cover-loading{display:none;}

/* V2.11.8: preload invisibly; reveal only the already-moving distant ring. */
.stage.is-intro-waiting{visibility:hidden;}
.stage.is-intro-spinning .book{pointer-events:none!important;}

/* V2.11.3: the road gets its own threshold-to-fantasy background. */
.book-path{background-image:linear-gradient(rgba(7,5,3,.10),rgba(7,5,3,.18)),url('./bookstore-path-fantasy-v2113.png')!important;background-size:cover!important;background-position:center center!important;background-repeat:no-repeat!important;}
.book-path .path-floor{opacity:.10!important;}
</style>
</head>
<body>
<header class="shop-head">
  <a class="brand" href="../bookshelf/" aria-label="本棚へ戻る"><strong>あ箱</strong><small>BOOK STORE β</small></a>
  <div class="shop-title"><span>あ箱書店</span><small>本を探すんじゃなく、見つける。</small></div>
  <a class="back" href="../bookshelf/">本棚へ</a>
</header>
<main>
  <section class="store" id="store" aria-label="あ箱書店">
    <div class="room-bg-layer" id="roomBgLayer" aria-hidden="true"></div>
    <div class="ambient" aria-hidden="true"></div>
    <div class="shelf shelf-top" aria-hidden="true"></div><div class="shelf shelf-mid" aria-hidden="true"></div><div class="shelf shelf-low" aria-hidden="true"></div>
    <div class="sign"><small>NEW ARRIVALS</small><strong>新しく入った本</strong></div>
    <div class="view-switch" role="group" aria-label="書店の見方"><button id="ringMode" type="button" class="is-active">本棚</button><button id="pathMode" type="button">通路</button></div>
    <button class="nav prev" id="prev" aria-label="前の本">‹</button>
    <div class="stage" id="stage" aria-live="polite"></div><div class="room-shelf" id="roomShelf" hidden aria-label="ファンタジーの本棚一覧"><div class="room-shelf-scroll" id="roomShelfScroll"><div class="room-shelf-grid" id="roomShelfGrid"></div></div><button class="room-motion" id="roomMotion" type="button">◎ 360°モーション OFF</button><div class="room-shelf-counter" id="roomShelfCounter">1 / 1</div><div class="room-shelf-hint">上下で棚を見る　／　左右で棚を回す　／　表紙をタップ</div></div>
    <div class="book-path" id="bookPath" hidden aria-label="本の道"><div class="path-floor" aria-hidden="true"></div><div class="path-books" id="pathBooks"></div><div class="route-gate" id="fantasyGate" hidden><small>FANTASY FOREST</small><strong>ファンタジーの森</strong><span>入口をタップ</span></div><div class="path-status"><strong id="pathStatus">指で進む</strong><span id="pathSub">下へスワイプすると、本の道を歩けます</span></div><button id="motionStart" type="button">端末の動きで歩く</button></div>
    <button class="nav next" id="next" aria-label="次の本">›</button>
    <div class="focus-panel" id="focusPanel"><div><small id="focusShelf">新しく入った本</small><strong id="focusTitle">読み込み中…</strong><span id="focusAuthor"></span></div><button id="focusPick" type="button">手に取る</button></div><div class="hint" id="hint">左右にスワイプして、棚を眺める</div>
  </section>
  <section class="below"><div><small>IN THE STORE</small><strong id="bookCount">読み込み中…</strong></div><p>いまは公開中の本を、そのまま店内に並べています。検索やランキングより先に、まず表紙が目に入る書店です。</p></section>
</main>
<div class="detail-layer" id="picked" hidden>
  <button class="detail-dismiss" id="detailDismiss" aria-label="棚に戻る"></button>
  <div class="axis-hint" id="axisHint">左右：同じ棚の本　／　上下：棚を移動</div>
  <article class="detail-card">
    <div class="detail-book" id="pickedCover"></div>
    <div class="detail-copy">
      <small id="pickedContext">PUBLIC BOOK</small><h1 id="pickedTitle"></h1><p id="pickedDetail"></p><p class="author" id="pickedAuthor"></p>
    </div>
    <div class="picked-actions"><button id="saveLater" type="button">あとで読む</button><a id="readBook" href="#">ひらく</a></div>
  </article>
</div>
<script src="./bookstore.js?v=2.16.15"></script>
</body>
</html>
