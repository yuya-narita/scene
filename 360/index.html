<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>あ箱 360°背景テスト</title><style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;text-shadow:0 2px 12px #000}.logo{font-size:24px;font-weight:800}.hint{font-size:12px;opacity:.75}.controls{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.controls button{border:1px solid #ffffff44;background:#111c;color:white;border-radius:999px;padding:11px 16px;font-weight:700;backdrop-filter:blur(10px)}.status{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);font-size:12px;background:#0008;padding:7px 12px;border-radius:99px;white-space:nowrap}.dot{position:absolute;left:50%;top:50%;width:5px;height:5px;background:#fff9;border-radius:50%;transform:translate(-50%,-50%)}</style></head><body><div id='app'><canvas id='c'></canvas></div><div class='hud'><div class='top'><div class='logo'>あ□ <span style='font-size:11px;font-weight:500;opacity:.65'>360° TEST</span></div><div class='hint'>ドラッグ / スワイプで見渡す</div></div><div class='dot'></div><div class='status' id='status'>指で360°確認できます</div><div class='controls'><button id='gyro'>iPhoneで見渡す</button><button id='reset'>中央へ</button></div></div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');const img=new Image();img.src='panorama.png';let yaw=0,pitch=0,fov=85,drag=false,lx=0,ly=0,gyroOn=false,baseA=null,baseB=null;
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';draw()}addEventListener('resize',resize);
function draw(){if(!img.complete)return;const W=canvas.width,H=canvas.height,iw=img.naturalWidth,ih=img.naturalHeight;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const vw=iw*(fov/360), vh=vw*(H/W);let sy=ih/2-vh/2+(pitch/180)*ih;sy=Math.max(0,Math.min(ih-vh,sy));let sx=((yaw%360)+360)%360/360*iw-vw/2;function part(x,w,dx,dw){ctx.drawImage(img,x,sy,w,vh,dx,0,dw,H)}if(sx<0){let a=-sx;part(iw-a,a,0,W*a/vw);part(0,vw-a,W*a/vw,W*(vw-a)/vw)}else if(sx+vw>iw){let a=iw-sx;part(sx,a,0,W*a/vw);part(0,vw-a,W*a/vw,W*(vw-a)/vw)}else part(sx,vw,0,W,H)}
img.onload=()=>{resize();draw()};
function start(x,y){drag=true;lx=x;ly=y}function move(x,y){if(!drag)return;yaw-=(x-lx)*.12;pitch+=(y-ly)*.08;pitch=Math.max(-55,Math.min(55,pitch));lx=x;ly=y;draw()}function end(){drag=false}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);start(e.clientX,e.clientY)});canvas.addEventListener('pointermove',e=>move(e.clientX,e.clientY));canvas.addEventListener('pointerup',end);canvas.addEventListener('wheel',e=>{fov=Math.max(45,Math.min(110,fov+e.deltaY*.03));draw()},{passive:true});
function orient(e){if(!gyroOn||e.alpha==null)return;if(baseA==null){baseA=e.alpha;baseB=e.beta}yaw=(e.alpha-baseA)*-1;pitch=Math.max(-55,Math.min(55,(e.beta-baseB)*.8));draw()}
addEventListener('deviceorientation',orient,true);
document.getElementById('gyro').onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){let r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw Error('permission')}gyroOn=true;baseA=baseB=null;document.getElementById('status').textContent='端末を動かして見渡せます';}catch(e){document.getElementById('status').textContent='モーション許可できませんでした';}};
document.getElementById('reset').onclick=()=>{yaw=pitch=0;fov=85;baseA=baseB=null;draw()};
</script></body></html>
