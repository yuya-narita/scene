<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>あ箱 本棚</title>
  <link rel="stylesheet" href="bookshelf.css?v=63.9.2">
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong><span>あ</span><span class="box">□</span></strong><small>本棚</small></div>
    <div class="topbar-actions">
      <button id="addButton" class="primary" type="button">＋ Masterを追加</button>
      <button id="addDistributionButton" type="button">＋ 自分の一冊</button>
    </div>
    <input id="distributionInput" type="file" accept=".scene,application/zip" hidden>
    <input id="fileInput" type="file" hidden>
  </header>

  <main>
    <section class="intro">
      <div>
        <p class="eyebrow">LOCAL BOOKSHELF</p>
        <h1>作品を、手元の本棚に。</h1>
        <p>Master .scene と、自分が持っている Distribution .scene をこの端末のブラウザ内に保存して管理します。作品本体はサーバーへ送信しません。</p>
      </div>
      <div class="intro-actions">
        <button id="backupButton" type="button">本棚をバックアップ</button>
        <button id="restoreButton" type="button">バックアップから復元</button>
        <input id="restoreInput" type="file" accept=".zip,application/zip" hidden>
      </div>
    </section>

    <section class="shelf-head">
      <div><h2>本棚</h2><p id="countText">0冊</p></div>
      <p class="local-note">この端末内に保存</p>
    </section>

    <section id="emptyState" class="empty">
      <div class="empty-mark">□</div>
      <h2 id="emptyTitle">まだ本棚は空です</h2>
      <p id="emptyCopy">自分が持っている一冊を追加してください。</p>
      <button id="emptyAddButton" class="primary" type="button">Masterを追加</button>
      <button id="emptyDistributionButton" type="button">自分の一冊を追加</button>
    </section>

    <nav id="shelfTabs" class="shelf-tabs" aria-label="本棚の切り替え">
      <button id="ownedTab" class="shelf-tab" type="button" data-shelf="owned">もっている本</button>
      <button id="createdTab" class="shelf-tab" type="button" data-shelf="created">つくった本</button>
    </nav>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <dialog id="detailDialog" class="detail-dialog">
    <button id="closeDetail" class="dialog-close" aria-label="閉じる">×</button>
    <div id="detailContent"></div>
  </dialog>

  <dialog id="treeDialog" class="tree-dialog">
    <header class="tree-dialog-bar">
      <div><p class="eyebrow">WORK TREE</p><h2 id="treeDialogTitle">作品の木</h2></div>
      <button id="closeTree" class="tree-dialog-close" type="button" aria-label="作品の木を閉じる">×</button>
    </header>
    <div id="treeDialogMeta" class="tree-dialog-meta"></div>
    <div id="treeDialogCanvas" class="tree-dialog-canvas"></div>
    <p class="tree-dialog-note">作品を根に、実際に届いた旅が枝として育ちます。大きく育った場合は、この画面の中をスクロールして見られます。</p>
  </dialog>

  <div id="sceneDropOverlay" class="scene-drop-overlay" aria-hidden="true">
    <div class="scene-drop-card"><strong>.scene をここにドロップ</strong><span>Master / Distribution を自動判定して本棚に追加します</span></div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="bookshelf.js?v=63.11"></script>
</body>
</html>
