<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あ箱の本 管理</title><style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ec;color:#1b1a18}.wrap{max-width:900px;margin:auto;padding:28px 18px 80px}h1{font-size:26px}.card{background:#fff;border:1px solid #ddd4c6;border-radius:18px;padding:18px;margin:14px 0}input,select,button{font:inherit;padding:10px 12px;border:1px solid #d6cec1;border-radius:10px;background:#fff}button{cursor:pointer;font-weight:700}.primary{background:#171717;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:220px}.item{padding:13px 0;border-top:1px solid #eee7dc}.item:first-child{border-top:0}.muted{color:#7d756a;font-size:12px}.badge{font-size:11px;font-weight:800}.err{color:#9b332d}label{font-size:12px;font-weight:700;display:grid;gap:5px}</style></head><body><div class="wrap"><p>あ□ ADMIN</p><h1>あ箱の本</h1>
<div class="card"><label>ADMIN TOKEN<input id="token" type="password" autocomplete="off"></label><div class="row" style="margin-top:10px"><button id="load" class="primary">読み込む</button><span id="status" class="muted"></span></div></div>
<div class="card"><h2>種本 / 開花を追加</h2><label>発行済みEdition<select id="edition" class="grow"></select></label><div class="row" style="margin-top:12px"><label>種類<select id="kind"><option value="seed">🌱 種本</option><option value="bloom">🌸 開花</option></select></label><label>発行冊数<input id="limit" type="number" min="1" max="100000" value="10"></label><button id="add" class="primary">あ箱の本に置く</button></div></div>
<div class="card"><h2>現在の棚</h2><div id="items" class="muted">読み込んでください。</div></div></div><script>
const API='https://scene-studio-api.a-hako.workers.dev';const $=s=>document.querySelector(s);let editions=[];
function headers(){return {'X-Admin-Key':$('#token').value.trim()}}
async function api(path,opt={}){const r=await fetch(API+path,{cache:'no-store',...opt,headers:{...headers(),...(opt.headers||{})}});const j=await r.json().catch(()=>null);if(!r.ok||!j?.ok)throw new Error(j?.error||`HTTP ${r.status}`);return j}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{$('#status').textContent='読み込み中…';const [e,s]=await Promise.all([api('/admin/official-shelf/editions'),api('/admin/official-shelf')]);editions=e.items||[];$('#edition').innerHTML=editions.map((x,i)=>`<option value="${i}">${esc(x.title)} — ${esc(x.author||'作者未設定')} / ${esc(x.editionId)}</option>`).join('')||'<option>Editionなし</option>';render(s.items||[]);$('#status').textContent='読み込みました。'}catch(e){$('#status').textContent=e.message;$('#status').classList.add('err')}}
function render(items){$('#items').innerHTML=items.length?items.map(x=>`<div class="item"><div class="row"><span class="badge">${x.kind==='bloom'?'🌸 開花':'🌱 種本'}</span><strong>${esc(x.title)}</strong><span class="muted">${esc(x.author||'作者未設定')}</span></div><div class="muted">${esc(x.workId)} / ${esc(x.editionId)} · ${x.issuedCount||0}/${x.issueLimit}冊発行 · ${esc(x.status)}</div><div class="row" style="margin-top:8px"><button data-id="${esc(x.shelfId)}" data-act="${x.status==='active'?'stop':'resume'}">${x.status==='active'?'停止':'再開'}</button></div></div>`).join(''):'まだありません。';document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{try{await api(`/admin/official-shelf/${b.dataset.id}/${b.dataset.act}`,{method:'POST'});await load()}catch(e){alert(e.message)}})}
$('#load').onclick=load;$('#add').onclick=async()=>{const x=editions[Number($('#edition').value)];if(!x)return;try{await api('/admin/official-shelf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workId:x.workId,editionId:x.editionId,kind:$('#kind').value,issueLimit:Number($('#limit').value)})});await load()}catch(e){alert(e.message)}};
</script></body></html>
