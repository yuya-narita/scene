<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>あ箱書店 2号店｜POPで出会う本</title><meta name="description" content="店員のことばをめくって、次に読む一冊を。あ箱書店のPOP書店。"><link rel="stylesheet" href="style.css?v=1.14"><script src="pop-ui.js?v=1.14" defer></script><script src="store.js?v=1.14" defer></script></head>
<body class="pop-store-page"><a class="skip" href="#catalogue">作品一覧へ</a>
<header><div class="header-inner"><a class="brand" href="./"><span class="book-mark" aria-hidden="true">▱</span><span>あ箱書店 <em>2号店</em><small>A-HAKO BOOKSTORE / POP STORE</small></span></a><button id="menuToggle" class="menu-toggle" aria-expanded="false" aria-controls="menu">メニュー <span aria-hidden="true">☰</span></button><nav id="menu" aria-label="関連ページ" hidden><a href="../bookstore/">1号店・立体書店</a><a href="../bookshelf/">自分の本棚</a><a href="admin.html">運営POP管理</a></nav></div>
<div class="search-wrap"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="作品・作者・あらすじで探す" aria-label="作品・作者・あらすじで検索" autocomplete="off"><kbd>検索</kbd></label></div>
<nav class="tabs" aria-label="作品の探し方"><button data-view="home" aria-current="page">ホーム</button><button data-view="all">作品一覧</button><button data-view="new">新着</button><button data-view="pop">店員のおすすめ</button><a href="#genres">ジャンル</a></nav></header>
<main><div id="loadStatus" class="status" role="status" aria-live="polite">本を並べています…</div><button id="retry" class="button" hidden>もう一度読み込む</button>
<div id="popStatus" class="muted" hidden><span id="popStatusText"></span> <button id="popRetry" class="text-button">POPを再読み込み</button></div>
<div id="heroLoading" class="hero-loading" aria-hidden="true"><div class="hero-loading-image"></div><div class="hero-loading-note"></div></div>
<section id="hero" class="hero" aria-label="一冊との出会い" hidden></section>
<section id="recommendations" hidden><div class="section-head"><div><p class="eyebrow">STAFF PICKS</p><h2>店員のおすすめ</h2></div><button data-view="pop" class="text-button">すべて見る →</button></div><div id="picks" class="books"></div></section>
<section id="genres"><div class="section-head"><div><p class="eyebrow">FIND YOUR NEXT BOOK</p><h2>ジャンルから探す</h2></div><button data-genre="" class="text-button" aria-pressed="true">すべての作品 →</button></div><div id="genreButtons" class="genres"></div></section>
<section id="catalogue" tabindex="-1"><div class="section-head"><div><p class="eyebrow" id="catalogueEyebrow">NEW ARRIVALS</p><h2 id="listTitle">新しく届いた本</h2></div><span id="resultCount" class="muted"></span></div><div id="activeFilter"></div><div id="books" class="books"></div><p id="empty" class="empty" hidden>条件に合う作品が見つかりませんでした。</p><button id="more" class="button more" hidden>続きを見る</button></section>
<aside class="invitation"><p>そのひと言から、<br><strong>読みたい一冊へ。</strong></p><span>気になるPOPを開いて、店員のことばをめくってみてください。</span></aside></main>
<footer><a class="brand" href="./">あ箱書店 <em>2号店</em></a><p>書店は静かに。本は普通に。POPだけ、ちょっと頭がおかしい。</p><a href="../bookstore/">1号店へ</a> · <a href="../bookshelf/">本棚へ</a></footer>
<dialog id="detailDialog" aria-labelledby="detailTitle"><button class="close" data-close aria-label="作品詳細を閉じる">×</button><div id="detailContent"></div></dialog>
<dialog id="popDialog" aria-labelledby="popTitle"><button class="close" data-close aria-label="POPを閉じる">×</button><p class="eyebrow">この本についた、店員のことば</p><h2 id="popTitle"></h2><div id="popStage" class="pop-stage"><button id="popPaper" class="pop-paper" aria-label="次のPOPをめくる"><span id="popText"></span><small id="popByline"></small><span class="pop-doodle" aria-hidden="true"></span></button></div><p id="popPosition" class="muted" aria-live="polite"></p><button id="popRead" class="text-button">作品の詳細を見る →</button></dialog>
</body></html>
