<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>運営POP管理｜あ箱書店2号店</title><link rel="stylesheet" href="style.css"><script src="admin.js?v=1.1" defer></script></head><body><header><div class="header-inner"><a class="brand" href="./">あ箱書店 <em>2号店</em></a><a class="text-button" href="../admin.html">既存Adminへ →</a></div></header><main class="admin-main"><p class="eyebrow">STAFF DESK</p><h1>運営POPをつくる</h1><p class="muted">作品を選んで、店員のことばを一枚ずつ。本文は240文字までです。</p>
<form id="connectForm"><label for="token">Adminトークン</label><input id="token" type="password" autocomplete="off" required><button class="button primary" type="submit" id="connect">接続する</button><button class="button" id="disconnect" type="button" hidden>接続を解除</button></form><p id="status" class="admin-status" role="status" aria-live="polite"></p>
<section id="workspace" hidden><label for="workSearch">作品名・作者名で絞り込む</label><input id="workSearch" type="search" placeholder="公開作品から探す"><label for="workSelect">POPを付ける作品</label><select id="workSelect"><option value="">作品を選択してください</option></select><label for="publicationId">公開作品ID</label><div class="filter-row"><input id="publicationId" pattern="[A-Za-z0-9_-]{6,80}" placeholder="非公開にした作品のPOPもIDで管理できます"><button class="button" type="button" id="loadWork">この作品を読み込む</button></div><p class="muted">公開停止した作品のPOPは、2号店には表示されません。</p>
<div id="workArea" hidden><h2 id="workTitle"></h2><button class="button" id="newPop" type="button">＋ 新しいPOP</button><form id="popForm" class="admin-form"><h3 id="formTitle">新しいPOP</h3><label for="text">POP本文</label><textarea id="text" maxlength="480" required placeholder="この本を、どんなひと言で紹介しますか？"></textarea><p id="charCount" class="muted">0 / 240文字</p><div class="filter-row"><div><label for="displayName">店員名</label><input id="displayName" maxlength="60" value="あ箱書店 店員" required></div><div><label for="style">付箋の色</label><select id="style"><option value="sticky-yellow">黄色</option><option value="sticky-pink">ピンク</option><option value="sticky-blue">水色</option></select></div></div><div class="filter-row"><div><label for="order">表示順（小さい順）</label><input id="order" type="number" min="0" max="9999" step="1" value="0" required></div><div><label for="publicationStatus">公開状態</label><select id="publicationStatus"><option value="draft">下書き（書店には表示しない）</option><option value="published">公開する</option></select></div></div><p id="publicationHint" class="muted" role="status">下書きは保存しても書店に表示されません。掲載するときは「公開して保存」を押してください。</p><label>POPの見え方</label><div id="preview" class="pop-preview"><strong id="previewText">この本を、どんなひと言で紹介しますか？</strong><small id="previewName">あ箱書店 店員</small></div><button class="button primary" type="submit" id="save">下書きとして保存</button><button class="button primary" type="submit" id="publishSave">公開して保存</button><button class="button" type="button" id="cancelEdit">編集をリセット</button><p id="saveStatus" class="admin-status" role="status" aria-live="polite"></p></form><h2>この作品のPOP</h2><p class="muted">表示順 → 作成日時の順にめくれます。削除済みのPOPは下書きとして復元できます。</p><div id="popList"></div></div></section></main></body></html>
