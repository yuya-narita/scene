<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>あ箱 運営</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div><small>AHACO ADMIN</small><h1>運営</h1></div>
      <button id="refreshButton" type="button" disabled>更新</button>
    </header>

    <section id="loginPanel" class="panel login-panel">
      <h2>管理者として接続</h2>
      <p>Cloudflareに設定した ADMIN_TOKEN を入力します。この端末のこのタブ内だけで保持します。</p>
      <div class="row">
        <input id="tokenInput" type="password" autocomplete="off" placeholder="ADMIN_TOKEN">
        <button id="connectButton" class="primary" type="button">接続</button>
      </div>
      <p id="loginStatus" class="status"></p>
    </section>

    <div id="adminContent" hidden>
      <section class="summary ops-summary">
        <div><small>作品</small><strong id="workCount">–</strong></div>
        <div><small>公開中</small><strong id="publishedCount">–</strong></div>
        <div><small>停止中</small><strong id="suspendedCount">–</strong></div>
        <div><small>R2使用量</small><strong id="r2Usage">–</strong></div>
        <div><small>素材</small><strong id="assetCount">–</strong></div>
        <div><small>未対応報告</small><strong id="openCount">0</strong></div>
      </section>

      <section class="panel">
        <div class="section-head"><div><small>STORAGE</small><h2>R2ストレージ</h2></div><small class="muted-note">24時間未満の未参照素材は保護</small></div>
        <div class="orphan-cleaner">
          <div class="orphan-copy"><small>未参照素材</small><strong id="orphanSummary">確認中…</strong><span id="orphanNote">現存作品から参照されていない素材を検出します。</span></div>
          <button id="cleanupOrphansButton" type="button" disabled>お掃除</button>
        </div>
        <div class="section-head work-ranking-head"><div><small>WORKS</small><h2>容量の大きい作品</h2></div><small class="muted-note">概算・共有素材は各作品に計上</small></div>
        <div id="heavyWorks" class="work-size-list"><div class="empty">読み込み中…</div></div>
      </section>

      <section class="panel">
        <div class="section-head"><div><small>REPORTS</small><h2>報告受信箱</h2></div><div class="report-tools"><span>表示 <strong id="shownCount">0</strong></span><select id="reportFilter"><option value="open">未対応</option><option value="resolved">対応済み</option><option value="deleted">作品削除済み</option><option value="all">すべて</option></select></div></div>
        <div id="reportList" class="report-list"></div>
      </section>

      <section class="panel">
        <small>DIRECT CONTROL</small><h2>workIdから直接操作</h2>
        <div class="row"><input id="workIdInput" type="text" placeholder="workId"><button id="inspectButton" type="button">確認</button></div>
        <div id="directResult" class="direct-result"></div>
      </section>
    </div>
  </main>
  <script src="./admin.js"></script>
</body>
</html>
