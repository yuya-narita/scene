<!doctype html>
<html lang="ja" class="public-book-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1016">
  <title>あ箱 Player</title>
  <meta name="description" content="あ箱 Player。あ箱の作品を読むためのプレイヤーです。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="あ箱">
  <meta property="og:title" content="あ箱 Player">
  <meta property="og:description" content="あ箱の作品を読むためのプレイヤーです。">
  <meta property="og:image" content="https://yuya-narita.github.io/scene/studio/ogp-ahako-beta.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="あ箱 Player">
  <meta name="twitter:description" content="あ箱の作品を読むためのプレイヤーです。">
  <meta name="twitter:image" content="https://yuya-narita.github.io/scene/studio/ogp-ahako-beta.png">
  <script>
    // Keep incoming bookshelf/review/RELAY links on their existing loader.
    const entry=new URL(location.href);
    if(!entry.searchParams.get('src')&&['bookshelfCopy','bookshelfMaster','preview','issue','review','officialShelf','relay','relayKey'].some(key=>entry.searchParams.get(key))){
      const destination=new URL('./local-player/',entry);
      destination.search=entry.search;destination.hash=entry.hash;
      location.replace(destination.href);
    }
  </script>
  <style>
    .book-loading{display:none}
    html.public-book-loading .book-loading,
    html.local-auto-open-pending .book-loading{
      position:fixed;inset:0;z-index:20001;display:flex;align-items:center;
      justify-content:center;gap:12px;padding:24px;background:#0b1016;
      color:rgba(245,245,242,.85);font:500 14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    html.local-auto-open-pending #localLauncher{display:none!important}
    .book-loading-spinner{width:18px;height:18px;border:2px solid rgba(245,245,242,.22);
      border-top-color:#f5f5f2;border-radius:50%;animation:book-loading-spin .8s linear infinite}
    @keyframes book-loading-spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.book-loading-spinner{animation:none}}
  </style>
  <link rel="stylesheet" href="./scene-player-core.css?v=20261109-card-frame-v8">
  <link rel="stylesheet" href="./public-player.css?v=20261015-ending-v17">
  <link rel="stylesheet" href="./ios-input-guard.css?v=70.4">
<style>.public-ending.is-shop-entry *{animation-delay:0s!important}.public-ending.is-shop-entry #publicEndingLabel{font-size:clamp(20px,5vw,34px)!important}.public-ending.is-shop-entry .public-own-copy-wrap{opacity:1!important;visibility:visible!important}.public-ending.is-shop-preparing #publicEndingLabel,.public-ending.is-shop-preparing #publicEndingActions,.public-ending.is-shop-preparing #publicOwnCopyWrap{visibility:hidden!important}.public-ending.is-shop-preparing:before{content:"購入内容を用意しています…";position:absolute;inset:40% 20px auto;text-align:center;color:#eee;font:14px/1.8 sans-serif}</style><link rel="stylesheet" href="./shared/work-share.css?v=1.35"><script src="./shared/work-share.js?v=1.36" defer></script><style>.public-intro > .public-share-work{position:absolute;right:18px;top:64px;z-index:5;background:transparent;border:1px solid #ffffff40;border-radius:20px;color:#ccc;padding:8px 14px;font:12px system-ui}.public-ending-actions .public-share-work{grid-column:1/-1;justify-self:center;font:12px system-ui;padding:9px 14px;border-radius:8px;border:1px solid #ffffff40;background:transparent;color:inherit}</style><style>.public-intro>.public-reading-privacy{position:absolute;right:18px;top:105px;z-index:5;color:#b3c0cd;font:11px/1.5 system-ui;padding:7px 3px;text-decoration:underline}</style></head>
<body>
  <a id="publicShelfReturn" class="public-shelf-return" href="../bookshelf/" hidden>← 本棚へ</a>
  <div id="publicBookLoading" class="book-loading" role="status" aria-live="polite">
    <span class="book-loading-spinner" aria-hidden="true"></span><span>本を読み込んでいます…</span>
  </div>

  <section id="publicIntro" class="public-intro" hidden>
    <a class="public-reading-privacy" href="./privacy/#public-reading">読書記録について</a>
    <div id="publicIntroCover" class="public-intro-cover"></div>
    <div id="publicIntroCoverDim" class="public-intro-cover-dim"></div>
    <div class="public-intro-frame">
      <div class="public-intro-copy">
        <div class="public-work-block">
          <img id="publicIntroLogo" class="public-logo" alt="" hidden>
          <h1 id="publicIntroTitle" class="public-title">Scene</h1>
          <p id="publicIntroDescription" class="public-description"></p>
          <p id="publicIntroAuthor" class="public-author"></p>
        </div>
        <div class="public-episode-block">
          <p id="publicIntroEpisode" class="public-episode" hidden></p>
          <p id="publicIntroEpisodeTitle" class="public-episode-title" hidden></p>
        </div>
      </div>
      <div class="public-intro-actions">
        <button id="publicStart" class="public-primary" type="button">はじめる</button>
        <button id="publicContinue" class="public-secondary" type="button" hidden>途中から</button>
      </div>
    </div>
  </section>

  <div id="publicOpening" class="public-opening" hidden>
    <div id="publicOpeningImage" class="public-opening-image"></div>
    <div id="publicOpeningDim" class="public-opening-dim"></div>
  </div>

  <div id="scenePlayer" class="public-player" hidden></div>

  <section id="publicEnding" class="public-ending" hidden>
    <div class="public-ending-inner">
      <p id="publicEndingLabel" class="public-ending-label" hidden></p>

      <div id="publicEndingActions" class="public-ending-actions public-ending-three">
        <a id="publicEndingLeft" class="public-ending-box" hidden><small></small><strong></strong></a>
        <button id="publicEndingCover" class="public-ending-box public-ending-cover" type="button"><small>COVER</small><strong>表紙に戻る</strong></button>
        <a id="publicEndingRight" class="public-ending-box" hidden><small></small><strong></strong></a>
      </div>
      <div id="publicOwnCopyWrap" class="public-own-copy-wrap" hidden>
        <button id="publicOwnCopy" class="public-own-copy" type="button">自分の一冊を受け取る</button>
        <p id="publicOwnCopyStatus" class="public-own-copy-status" aria-live="polite"></p>
      </div>
      <section id="publicJourney" class="public-journey" hidden aria-live="polite" role="button" tabindex="0" aria-label="次の一人へ">
        <small>この一冊の旅</small>
        <strong id="publicJourneyMessage"></strong>
        <div id="publicJourneyPath" class="public-journey-path" aria-hidden="true"></div>
        <p id="publicJourneyPrompt">面白かったら、次の一人へ。</p>
      </section>
      <button id="publicRelay" class="public-relay" type="button" hidden aria-hidden="true">次の一人へ</button>
    </div>
  </section>

  <section id="publicError" class="public-error" hidden>
    <div class="public-error-card">
      <strong id="publicErrorTitle">Sceneを開けませんでした</strong>
      <p id="publicErrorMessage"></p>
      <button id="publicRetry" type="button">もう一度読み込む</button>
    </div>
  </section>


  <button id="publicReportButton" class="public-report-trigger" type="button">この作品について報告</button>

  <dialog id="publicReportDialog" class="public-report-dialog">
    <form method="dialog" class="public-report-card">
      <button id="publicReportClose" class="public-report-close" type="button" aria-label="閉じる">×</button>
      <small>REPORT</small>
      <h2>この作品について報告</h2>
      <fieldset class="public-report-section">
        <legend>報告理由</legend>
        <label><input type="radio" name="reportReason" value="unauthorized" checked> 自分の作品が無断で使用されている</label>
        <label><input type="radio" name="reportReason" value="copyright"> 第三者の著作物・権利侵害と思われる</label>
        <label><input type="radio" name="reportReason" value="other"> その他</label>
      </fieldset>
      <label class="public-report-field">
        <span>問題のある箇所 <b>必須</b></span>
        <select id="publicReportSubject">
          <option value="text">本文・文章</option>
          <option value="cover">表紙</option>
          <option value="image">背景・画像</option>
          <option value="audio">BGM・SE・音声</option>
          <option value="other">その他</option>
        </select>
      </label>
      <label class="public-report-field" id="publicReportEvidenceWrap">
        <span>元作品・権利を確認できるURL <b id="publicReportEvidenceRequired">必須</b></span>
        <input id="publicReportEvidenceUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://note.com/...">
        <small>元作品の掲載ページなど、運営が比較できるURLを入力してください。</small>
      </label>
      <label class="public-report-field">
        <span>詳しい内容 <b>必須</b></span>
        <textarea id="publicReportDetails" rows="4" maxlength="1200" placeholder="例：上記URLで公開している本文が、そのまま使用されています。"></textarea>
      </label>
      <label class="public-report-field">
        <span>連絡先メール <b id="publicReportContactRequired">必須</b></span>
        <input id="publicReportContact" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com">
        <small id="publicReportContactHint">確認が必要な場合に運営から連絡するために使用します。</small>
      </label>
      <label class="public-report-confirm"><input id="publicReportConfirm" type="checkbox"> <span>この報告内容が正確であることを確認します。</span></label>
      <div class="public-report-meta"><span>workId</span><code id="publicReportWorkId">-</code><span>対象URL</span><code id="publicReportUrl">-</code></div>
      <p id="publicReportStatus" class="public-report-status">根拠を確認できる情報と一緒に運営へ送信します。</p>
      <button id="publicReportCopy" type="button" class="public-report-copy">運営に申立てを送る</button>
    </form>
  </dialog>

  <script src="./scene-player-core.js?v=20261117-spatial-heading-v1"></script>
  <!-- RPG command renderer: same shared implementation as Studio and Local Player. -->
  <link rel="stylesheet" href="./shared/scene-rpg-player.css?v=20261112-card-kinds-v1">
  <script src="./shared/scene-rpg-command.js?v=20261112-public-rpg-1"></script>
  <script src="./shared/scene-rpg-player.js?v=20261112-card-kinds-v1"></script>
  <script src="./shared/work-measurement.js?v=1.35"></script>
  <script src="./shared/scene-reach.js?v=1.32"></script>
  <script src="./shared/reading-return.js?v=1.37"></script>
  <link rel="stylesheet" href="./shared/scene-letter.css?v=1.39"><script src="./shared/scene-letter.js?v=1.39"></script>
  <script src="./public-player.js?v=1.39"></script>
  <script src="./ahako-dialog.js?v=70.3"></script>
</body>
</html>
